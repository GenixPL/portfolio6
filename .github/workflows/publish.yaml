name: Publish to Github Pages

on:
  push:
    branches:
      - 'release'
  # This line alone enables the manual trigger with branch selection
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Verify Flutter installation
        run: flutter --version

      - name: ls in build
        run: ls build/

      - name: Build web
        run: flutter build web --release

      - name: ls in build
        run: ls build/

