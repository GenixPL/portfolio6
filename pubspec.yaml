name: portfolio6
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  flutter: 3.41.6
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: 1.6.0
  gap: 3.0.1
  go_router: 17.1.0
  url_launcher: 6.3.2
  intl: 0.20.2
  sliver_tools: 0.2.12

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: CPMono
      fonts:
        - asset: assets/fonts/CPMono.otf
    - family: Kontanter
      fonts:
        - asset: assets/fonts/Kontanter.otf
    - family: Assistant
      fonts:
        - asset: assets/fonts/Assistant-Regular.ttf
        - asset: assets/fonts/Assistant-Bold.ttf
          weight: 700
        - asset: assets/fonts/Assistant-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Assistant-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Assistant-Light.ttf
          weight: 300
        - asset: assets/fonts/Assistant-Medium.ttf
          weight: 400
        - asset: assets/fonts/Assistant-SemiBold.ttf
          weight: 600
