name: portfolio6
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  flutter: 3.41.6
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_svg: 2.2.4
  collection: 1.19.1
  http: 1.6.0
  gap: 3.0.1
  go_router: 17.2.2
  url_launcher: 6.3.2
  intl: 0.20.2
  web: 1.1.1
  dino_game:
    git:
      url: https://github.com/GenixPL/dino_game.git
      ref: 1.2.0
  json_annotation: 4.11.0

dev_dependencies:
  build_runner: 2.15.0
  flutter_lints: 6.0.0
  json_serializable: 6.13.2

flutter:
  uses-material-design: true

  assets:
    - assets/files/

    - assets/images/

    - assets/images/logos/

    - assets/images/hackathons/campus_app_challenge/
    - assets/images/hackathons/facebook/
    - assets/images/hackathons/hack_the_crisis/

    - assets/images/projects/myword/
    - assets/images/projects/myword/first_version/
    - assets/images/projects/myword/second_version/
    - assets/images/projects/myword/third_version/
    - assets/images/projects/pictile/
    - assets/images/projects/placelytics/
    - assets/images/projects/quarantino/
    - assets/images/projects/rust-morse/
    - assets/images/projects/thg/
    - assets/images/projects/sudoku/
    - assets/images/projects/color-remover/
    - assets/images/projects/website/

    - assets/images/work/
    - assets/images/work/btp/
    - assets/images/work/coop/
    - assets/images/work/fh/

  fonts:
    - family: CPMono
      fonts:
        - asset: assets/fonts/CPMono.otf

    - family: Kontanter
      fonts:
        - asset: assets/fonts/Kontanter.otf

    - family: Inter
      fonts:
      - asset: assets/fonts/Inter_24pt-Thin.ttf
        weight: 100
      - asset: assets/fonts/Inter_24pt-ExtraLight.ttf
        weight: 200
      - asset: assets/fonts/Inter_24pt-Light.ttf
        weight: 300
      - asset: assets/fonts/Inter_24pt-Regular.ttf
        weight: 400
      - asset: assets/fonts/Inter_24pt-Medium.ttf
        weight: 500
      - asset: assets/fonts/Inter_24pt-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Inter_24pt-Bold.ttf
        weight: 700
      - asset: assets/fonts/Inter_24pt-ExtraBold.ttf
        weight: 800
      - asset: assets/fonts/Inter_24pt-Black.ttf
        weight: 900

    - family: Assistant
      fonts:
      - asset: assets/fonts/Assistant-ExtraLight.ttf
        weight: 200
      - asset: assets/fonts/Assistant-Light.ttf
        weight: 300
      - asset: assets/fonts/Assistant-Regular.ttf
        weight: 400
      - asset: assets/fonts/Assistant-Medium.ttf
        weight: 500
      - asset: assets/fonts/Assistant-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Assistant-Bold.ttf
        weight: 700
      - asset: assets/fonts/Assistant-ExtraBold.ttf
        weight: 800

