name: portfolio6
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  flutter: 3.41.6
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  gap: 3.0.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: CPMono
      fonts:
        - asset: assets/fonts/CPMono.otf
    - family: Kontanter
      fonts:
        - asset: assets/fonts/Kontanter.otf
    - family: Prime
      fonts:
        - asset: assets/fonts/Prime.otf
